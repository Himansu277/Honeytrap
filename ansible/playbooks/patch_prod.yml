---
# ==============================================================================
# HoneyTrap - Playbook 3: patch_prod.yml
# Production Server Automated Security Patching & Vulnerability Mitigation
# ==============================================================================
- name: Apply Security Patches to Protected Production Servers
  hosts: production
  gather_facts: yes
  tasks:
    - name: Update apt cache repositories
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade critical security packages
      ansible.builtin.apt:
        upgrade: dist
        default_release: "{{ ansible_distribution_release }}"
      register: upgrade_output

    - name: Check if server reboot is required following kernel or library updates
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot production server if kernel patch applied
      ansible.builtin.reboot:
        msg: "HoneyTrap Security Routine: Rebooting to apply critical kernel security updates"
        connect_timeout: 10
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists

    - name: Verify enterprise web portal service is operational
      ansible.builtin.uri:
        url: http://127.0.0.1:80/
        status_code: 200
      register: web_check
      retries: 3
      delay: 5
      until: web_check.status == 200

    - name: Verify Fail2Ban and Auditd security daemons
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - fail2ban
        - auditd

    - name: Security patching summary
      ansible.builtin.debug:
        msg: "PRODUCTION PATCHING COMPLETE: All latest security definitions applied. Services verified operational."
