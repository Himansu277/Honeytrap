---
# ==============================================================================
# HoneyTrap - Playbook 1: incident_response.yml
# Forensic Evidence Preservation: S3 Log Backup & AWS EBS Disk Snapshotting
# ==============================================================================
- name: Forensic Incident Response and Evidence Preservation
  hosts: honeypot
  gather_facts: yes
  vars:
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    evidence_dir: "/tmp/evidence_{{ timestamp }}"
    archive_name: "incident_evidence_{{ timestamp }}.tar.gz"

  tasks:
    - name: Create local staging directory for volatile memory and log triage
      ansible.builtin.file:
        path: "{{ evidence_dir }}"
        state: directory
        mode: '0700'

    - name: Dump volatile system state (Process tree & open sockets)
      ansible.builtin.shell: |
        ps auxf > {{ evidence_dir }}/process_list.txt
        ss -antup > {{ evidence_dir }}/active_connections.txt
        netstat -tulpn > {{ evidence_dir }}/listening_ports.txt 2>/dev/null || true
        last -a > {{ evidence_dir }}/login_history.txt
        w > {{ evidence_dir }}/current_users.txt
      ignore_errors: yes

    - name: Copy Cowrie JSON and raw audit logs to evidence package
      ansible.builtin.shell: |
        if [ -d "{{ cowrie_log_dir }}" ]; then
          cp -r {{ cowrie_log_dir }} {{ evidence_dir }}/cowrie_logs
        fi
        if [ -d "{{ cowrie_tty_dir }}" ]; then
          cp -r {{ cowrie_tty_dir }} {{ evidence_dir }}/cowrie_tty_recordings
        fi
        if [ -f /opt/honeytrap/dashboard/data/cowrie.json ]; then
          mkdir -p {{ evidence_dir }}/honeytrap_logs
          cp /opt/honeytrap/dashboard/data/*.json {{ evidence_dir }}/honeytrap_logs/ 2>/dev/null || true
        fi
      ignore_errors: yes

    - name: Compress evidence folder into encrypted/secured archive
      ansible.builtin.archive:
        path: "{{ evidence_dir }}/*"
        dest: "/tmp/{{ archive_name }}"
        format: gz

    - name: Upload evidence package to AWS S3 bucket
      ansible.builtin.shell: |
        aws s3 cp /tmp/{{ archive_name }} s3://{{ s3_evidence_bucket }}/incidents/{{ timestamp }}/{{ archive_name }} || true
      environment:
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      ignore_errors: yes

    - name: Sync latest cowrie.json to Dashboard local evidence directory
      ansible.builtin.fetch:
        src: "{{ cowrie_log_dir }}/cowrie.json"
        dest: "{{ dashboard_sync_path }}/cowrie_latest.json"
        flat: yes
      ignore_errors: yes

    - name: Note on disk state (Paid EBS snapshot creation disabled to prevent AWS recurring charges)
      ansible.builtin.debug:
        msg: "EBS automated snapshot creation is disabled (enable_ebs_snapshots: false) to prevent recurring AWS storage charges. Evidence preserved locally and in S3."

    - name: Clean up temporary triage files on honeypot
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ evidence_dir }}"
        - "/tmp/{{ archive_name }}"

    - name: Log forensic completion
      ansible.builtin.debug:
        msg: "Forensic evidence package {{ archive_name }} saved to S3 bucket {{ s3_evidence_bucket }}."
