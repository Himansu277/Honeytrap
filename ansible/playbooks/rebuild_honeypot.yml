---
# ==============================================================================
# HoneyTrap - Playbook 2: rebuild_honeypot.yml
# Self-Healing Automation: Reset Compromised Trap & Re-arm Clean Defense
# ==============================================================================
- name: Honeypot Rebuild and Self-Healing Cycle
  hosts: honeypot
  gather_facts: no
  tasks:
    - name: Terminate compromised honeypot session & honeypot services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - honeytrap-honeypot
        - cowrie
      ignore_errors: yes

    - name: Terminate any lingering attacker processes / child shells
      ansible.builtin.shell: |
        pkill -u cowrie 2>/dev/null || true
        pkill -f honeypot_service.py 2>/dev/null || true
      ignore_errors: yes

    - name: Archive and purge contaminated workspace
      ansible.builtin.shell: |
        mv /home/cowrie/cowrie/var/log/cowrie/cowrie.json /home/cowrie/cowrie/var/log/cowrie/cowrie_archived_$(date +%s).json 2>/dev/null || true
        rm -rf /home/cowrie/cowrie/var/lib/cowrie/downloads/* 2>/dev/null || true
        touch /home/cowrie/cowrie/var/log/cowrie/cowrie.json 2>/dev/null || true
        chown -R cowrie:cowrie /home/cowrie/cowrie/var 2>/dev/null || true
        # Also rotate HoneyTrap application logs if present
        if [ -f /opt/honeytrap/dashboard/data/cowrie.json ]; then
          cp /opt/honeytrap/dashboard/data/cowrie.json /opt/honeytrap/dashboard/data/cowrie_archived_$(date +%s).json 2>/dev/null || true
          > /opt/honeytrap/dashboard/data/cowrie.json
        fi
      ignore_errors: yes

    - name: Run Puppet agent to enforce declarative baseline state & fix configuration drift
      ansible.builtin.shell: |
        if command -v puppet >/dev/null 2>&1; then
          puppet apply /opt/honeytrap/puppet/manifests/site.pp || true
        fi
      ignore_errors: yes

    - name: Reset Nagios intrusion detection pointer
      ansible.builtin.file:
        path: /tmp/nagios_cowrie_pointer.dat
        state: absent

    - name: Restart Honeypot Service in pristine state
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      loop:
        - honeytrap-honeypot
      ignore_errors: yes

    - name: Confirm Honeypot is active and listening on public port 22
      ansible.builtin.wait_for:
        port: 22
        delay: 2
        timeout: 20
      ignore_errors: yes

    - name: Self-Healing validation status
      ansible.builtin.debug:
        msg: "SELF-HEALING COMPLETE: Honeypot has been purged, re-armed, and is actively trapping new threats on port 22."
