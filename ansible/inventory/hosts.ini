# ==============================================================================
# HoneyTrap - Ansible Inventory (hosts.ini)
# Single-Server Deployment Architecture
# ==============================================================================

[management]
bastion ansible_host=127.0.0.1 ansible_connection=local

[honeypot]
honeytrap-server ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu

[production]
prod-node ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu

[aws_infrastructure:children]
management
honeypot
production
