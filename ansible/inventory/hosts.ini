# ==============================================================================
# HoneyTrap - Ansible Inventory (hosts.ini)
# Target OS: Amazon Linux 2023 (Default SSH User: ec2-user)
# ==============================================================================

[management]
bastion ansible_host=127.0.0.1 ansible_connection=local

[honeypot]
honeytrap-server ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ec2-user

[production]
prod-node ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ec2-user

[aws_infrastructure:children]
management
honeypot
production
