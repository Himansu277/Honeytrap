# ==============================================================================
# HoneyTrap - Nagios Core Main Configuration (nagios.cfg)
# Orchestrates active health checks and automated incident response event handlers
# ==============================================================================

log_file=/var/log/nagios/nagios.log
cfg_dir=/etc/nagios/conf.d
resource_file=/etc/nagios/resource.cfg
status_file=/var/lib/nagios/status.dat
status_update_interval=10
nagios_user=nagios
nagios_group=nagios

check_external_commands=1
command_check_interval=-1
command_file=/var/lib/nagios/rw/nagios.cmd

# Enable Event Handlers - CRITICAL FOR SELF-HEALING ARCHITECTURE
enable_event_handlers=1
log_event_handlers=1

log_initial_states=1
log_notifications=1
log_service_retries=1
log_host_retries=1
log_passive_checks=1

service_check_timeout=60
host_check_timeout=30
event_handler_timeout=300
notification_timeout=30

interval_length=60
check_for_updates=0
