# ==============================================================================
# HoneyTrap - Host Definitions (hosts.cfg)
# ==============================================================================

define host {
    use                     generic-host
    host_name               bastion-control
    alias                   HoneyTrap Control Node (Nagios/Puppet/Ansible)
    address                 127.0.0.1
}

define host {
    use                     generic-host
    host_name               honeypot-trap
    alias                   Cowrie Isolated Honeypot Host
    address                 10.0.2.10 # Replaced dynamically with Honeypot IP
}

define host {
    use                     generic-host
    host_name               production-server
    alias                   Protected Production Server
    address                 10.0.3.10 # Replaced dynamically with Production IP
}

define hostgroup {
    hostgroup_name          honeytrap-infrastructure
    alias                   HoneyTrap Monitored Infrastructure
    members                 bastion-control,honeypot-trap,production-server
}
