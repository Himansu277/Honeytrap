# ==============================================================================
# HoneyTrap - Service Definitions (services.cfg)
# Monitored checks for Honeypot, Production, and Control Node
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HONEYPOT SERVICES (With Self-Healing Event Handler)
# ------------------------------------------------------------------------------

# The Core Honeypot Intrusion Monitor: triggers automated self-healing response!
define service {
    use                     honeypot-service
    host_name               honeypot-trap
    service_description     Cowrie_Intrusion_Detection
    check_command           check_nrpe!check_cowrie
    event_handler_enabled   1
    event_handler           handle_honeypot_attack
    notes                   "Triggers Ansible S3 forensic capture and Terraform node rebuild on CRITICAL"
}

# Verify Cowrie Process is running
define service {
    use                     generic-service
    host_name               honeypot-trap
    service_description     Cowrie_Process_Health
    check_command           check_nrpe!check_cowrie_proc
}

# Honeypot Disk Usage Check
define service {
    use                     generic-service
    host_name               honeypot-trap
    service_description     Honeypot_Disk_Space
    check_command           check_nrpe!check_disk
}

# ------------------------------------------------------------------------------
# 2. PRODUCTION PROTECTED SERVICES
# ------------------------------------------------------------------------------

# Production Nginx Web Application Health
define service {
    use                     generic-service
    host_name               production-server
    service_description     Internal_Enterprise_Portal_HTTP
    check_command           check_nrpe!check_nginx
}

# Production CPU Load
define service {
    use                     generic-service
    host_name               production-server
    service_description     Production_CPU_Load
    check_command           check_nrpe!check_load
}

# ------------------------------------------------------------------------------
# 3. CONTROL NODE SERVICES
# ------------------------------------------------------------------------------

# Check Ping to Control Node
define service {
    use                     generic-service
    host_name               bastion-control
    service_description     Local_Ping
    check_command           check_ping!100.0,20%!500.0,60%
}
