# ==============================================================================
# HoneyTrap - Nagios Commands (commands.cfg)
# ==============================================================================

# NRPE Check Command
define command {
    command_name    check_nrpe
    command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

# Host alive ping
define command {
    command_name    check-host-alive
    command_line    /usr/lib/nagios/plugins/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

# Check ping
define command {
    command_name    check_ping
    command_line    /usr/lib/nagios/plugins/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$
}

# EVENT HANDLER: Triggers Ansible playbooks on Honeypot Intrusion CRITICAL state
define command {
    command_name    handle_honeypot_attack
    command_line    /opt/honeytrap/nagios/eventhandlers/handle_honeypot_attack.sh "$SERVICESTATE$" "$SERVICESTATETYPE$" "$SERVICEATTEMPT$" "$HOSTADDRESS$"
}

# SNS Notification Command: Sends instant alert to AWS SNS topic
define command {
    command_name    notify-service-by-sns
    command_line    /usr/bin/aws sns publish --topic-arn "$CONTACTPAGER$" --subject "HoneyTrap Alert: $NOTIFICATIONTYPE$ - $HOSTNAME$/$SERVICEDESC$ is $SERVICESTATE$" --message "HoneyTrap Intrusion Alert!\n\nHost: $HOSTNAME$\nService: $SERVICEDESC$\nState: $SERVICESTATE$\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n$SERVICEOUTPUT$\n\nSelf-Healing Event Handler initiated."
}

# Email Notification Command
define command {
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** HoneyTrap Alert *****\n\nNotification Type: $NOTIFICATIONTYPE$\n\nService: $SERVICEDESC$\nHost: $HOSTNAME$\nState: $SERVICESTATE$\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n$SERVICEOUTPUT$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Service Alert: $HOSTNAME$/$SERVICEDESC$ is $SERVICESTATE$ **" $CONTACTEMAIL$
}
