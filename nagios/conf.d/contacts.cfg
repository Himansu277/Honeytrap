# ==============================================================================
# HoneyTrap - Contacts & Alert Groups (contacts.cfg)
# ==============================================================================

define contact {
    contact_name                    admin-sns
    alias                           HoneyTrap Security Team (SNS + Email)
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r,f,s
    host_notification_options       d,u,r,f,s
    service_notification_commands   notify-service-by-sns
    host_notification_commands      notify-service-by-sns
    email                           admin@example.com
    pager                           arn:aws:sns:us-east-1:123456789012:honeytrap-attack-alerts
}

define contactgroup {
    contactgroup_name               security-admins
    alias                           HoneyTrap Incident Response Team
    members                         admin-sns
}
