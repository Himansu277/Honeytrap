# ==============================================================================
# HoneyTrap - Nagios Templates (templates.cfg)
# ==============================================================================

define host {
    name                            generic-host
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information      1
    retain_nonstatus_information   1
    check_command                   check-host-alive
    max_check_attempts              3
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    notification_interval           120
    notification_period             24x7
    notification_options            d,u,r
    contact_groups                  security-admins
    register                        0
}

define service {
    name                            generic-service
    active_checks_enabled           1
    passive_checks_enabled          1
    parallelize_check               1
    obsess_over_service             1
    check_freshness                 0
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information      1
    retain_nonstatus_information   1
    is_volatile                     0
    check_period                    24x7
    max_check_attempts              3
    check_interval                  2
    retry_interval                  1
    contact_groups                  security-admins
    notification_options            w,u,c,r
    notification_interval           60
    notification_period             24x7
    register                        0
}

# Real-time Honeypot Service Template: Fast 1-minute check & single-attempt alert
define service {
    name                            honeypot-service
    use                             generic-service
    max_check_attempts              1    # Trigger IMMEDIATELY on first detection
    check_interval                  1    # Check every 60 seconds
    retry_interval                  1
    is_volatile                     1
    notification_options            w,c,r
    register                        0
}
